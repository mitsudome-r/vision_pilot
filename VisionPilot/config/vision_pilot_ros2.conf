# VisionPilot ROS2 configuration template

source.input_camera_topic   = /camera/image

vehicle_speed_topic         = /vehicle/speed
vehicle_steering_topic      = /vehicle/steering_cmd
vehicle_acceleration_topic  = /vehicle/throttle_cmd

# ─── Interface selection ─────────────────────────────────────────────────────
# generic  : std_msgs/Float64 topics above
# autoware : autoware_vehicle_msgs/VelocityReport in, autoware_control_msgs/Control out
ros2.vehicle_interface      = generic
# reliable (default) | sensor_data (best effort; required for best-effort camera drivers)
ros2.camera_qos             = reliable
# raw (default): sensor_msgs/Image | compressed: sensor_msgs/CompressedImage (JPEG/PNG), decoded
# in-process. Overridable with the --camera-transport CLI flag (used by the launch files).
ros2.camera_transport       = raw

# ─── Autoware interface (ros2.vehicle_interface = autoware) ─────────────────
# Keep the /vision_pilot/... names and remap them in launch/vision_pilot.launch.xml.
autoware.velocity_topic     = /vision_pilot/input/velocity_status
autoware.control_cmd_topic  = /vision_pilot/output/control_cmd
